<!-- Source for public/og.png, the link-preview card (WhatsApp, Slack, iMessage,
     Twitter). Kept in the repo as SVG because the PNG is generated from it —
     see the note in app/layout.tsx.

     Designed for the SMALL rendering, not the large one: WhatsApp shows this
     as a thumbnail a couple of centimetres wide beside the title, so there is
     one short line of type at a size that survives that reduction, and no body
     copy. The mark and wordmark carry the rest.

     1200x630 is the OG standard ratio; every consumer either uses it whole or
     centre-crops it, so nothing meaningful sits within 90px of an edge.
     allow-hardcode: brand colours and SVG geometry, not configuration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#14A89A"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#14A89A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="606" width="1200" height="24" fill="url(#brand)"/>

  <!-- The full mark on its plate, as the nav shows it — deliberately NOT
       public/icon.svg, which is stripped down to the bare "e" for legibility
       at 16px. There is room for the whole mark at 120px in a link preview. -->
  <g transform="translate(96 96) scale(1.875)">
    <rect width="64" height="64" rx="14" fill="url(#plate)"/>
    <g fill="#fff">
      <circle cx="11" cy="24" r="2.4"/>
      <circle cx="12" cy="32" r="2.1"/>
      <circle cx="13.5" cy="40" r="1.8"/>
    </g>
    <g stroke="#fff" stroke-width="2.8" stroke-linecap="round">
      <path d="M16.5 24h6.5"/>
      <path d="M17.5 32h5"/>
      <path d="M19 40h3.5"/>
    </g>
    <path d="M26 33c0-6.4 5.2-11.2 11.6-11.2S48.6 26 48.6 31c0 1.3-.8 2-2.2 2H26z"
          fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M47 38a11.2 11.2 0 0 1-20.5 1.9"
          fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M43 35.8 48.2 37.8 46.2 43z" fill="#fff"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="248" y="150" font-size="52" font-weight="700" fill="#0b1220">
      express<tspan fill="#1D4ED8">automate</tspan>.app
    </text>
    <text x="250" y="192" font-size="24" font-weight="500" fill="#5b6b82" letter-spacing="4">
      AI RECRUITMENT OPERATIONS
    </text>

    <text x="96" y="355" font-size="66" font-weight="700" fill="#0b1220" letter-spacing="-2">
      Your agency knows more than
    </text>
    <text x="96" y="432" font-size="66" font-weight="700" fill="#0b1220" letter-spacing="-2">
      any one person can see.
    </text>
    <text x="96" y="509" font-size="66" font-weight="700" fill="#1D4ED8" letter-spacing="-2">
      Put it in one place.
    </text>

    <text x="96" y="566" font-size="27" font-weight="500" fill="#5b6b82">
      AI recruitment intelligence &amp; operations
    </text>
  </g>
</svg>
