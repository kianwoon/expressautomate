<!-- The favicon: the "e" from app/logo.tsx and nothing else.

     It used to be the whole mark on a rounded gradient plate. The plate was
     the wrong call — it spent most of a 16px canvas on a background, leaving
     the "e" itself about nine pixels tall, which is why it read as a blue
     smudge in a tab. draftproof's favicon takes the opposite approach and its
     mark runs edge to edge; this now does the same.

     Two things are deliberately dropped from the full mark:
     - the plate, so the icon is transparent and sits on whatever the browser's
       tab colour is, light or dark. The blue-to-teal gradient carries against
       both; white strokes on a plate only ever worked against the plate.
     - the three speed lines, which at 16px are sub-pixel dots and turn to mud.
       The bowl and the circular arrow are what make the mark recognisable.

     The "e" occupies roughly x 22-54, y 17-50 in app/logo.tsx's 64-unit
     canvas. The transform recentres that box and scales it to fill this one,
     which also scales the stroke weight up — wanted, since a hairline is the
     other way a favicon disappears. Kept as a transform rather than rewritten
     coordinates so it stays visibly derived from the component.

     allow-hardcode: SVG path geometry and brand colours, not configuration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="expressautomate.app">
  <defs>
    <linearGradient id="ea-mark" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#14A89A"/>
    </linearGradient>
  </defs>

  <g transform="translate(32 32) scale(1.78) translate(-38 -33.25)"
     fill="none" stroke="url(#ea-mark)" stroke-width="4">
    <!-- bowl and crossbar -->
    <path d="M24 33c0-8 6.5-14 14.5-14S52 24.2 52 30.5c0 1.6-1 2.5-2.7 2.5H24z"
          stroke-linejoin="round"/>
    <!-- circular arrow closing the loop -->
    <path d="M50 39a14 14 0 0 1-25.6 2.4" stroke-linecap="round"/>
    <path d="M45 36.5 51.5 39 49 45.5z" fill="url(#ea-mark)" stroke="none"/>
  </g>
</svg>
