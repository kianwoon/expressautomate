<!-- The brand mark from app/logo.tsx, standalone, for use as the site favicon.
     Kept byte-for-byte in step with that component: the "e" whose bowl opens
     into a circular arrow, speed lines entering from the left, blue-to-teal.

     Two deliberate differences from the React version:
     - a rounded filled plate behind the mark, because a favicon is rendered at
       16px against an unknown tab colour and the bare strokes disappear on a
       dark background;
     - the strokes are white on the plate rather than gradient-on-transparent,
       for the same reason.
     allow-hardcode: SVG path geometry and brand colours, not configuration. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ea-plate" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#14A89A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ea-plate)"/>

  <g fill="#fff">
    <circle cx="11" cy="24" r="2.4"/>
    <circle cx="12" cy="32" r="2.1"/>
    <circle cx="13.5" cy="40" r="1.8"/>
  </g>
  <g stroke="#fff" stroke-width="2.8" stroke-linecap="round">
    <path d="M16.5 24h6.5"/>
    <path d="M17.5 32h5"/>
    <path d="M19 40h3.5"/>
  </g>

  <path d="M26 33c0-6.4 5.2-11.2 11.6-11.2S48.6 26 48.6 31c0 1.3-.8 2-2.2 2H26z"
        fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M47 38a11.2 11.2 0 0 1-20.5 1.9"
        fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M43 35.8 48.2 37.8 46.2 43z" fill="#fff"/>
</svg>
