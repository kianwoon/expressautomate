name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  # Same rule as the backend workflow: run-level cancellation would kill an
  # in-progress deploy, so only PR runs are cancellable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kianwoon/expressautomate-web
  KOYEB_REGISTRY_SECRET: ghcr-expressautomate
  WEB_SERVICE_ID: 685ec643-bfc9-4d54-b2b3-642e79f621c5

jobs:
  # Lint runs on its own so a formatting slip fails fast and cheap; the image
  # build repeats the compile anyway, inside Docker.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The PAT, not GITHUB_TOKEN: a package created by GITHUB_TOKEN is
      # readable only by that ephemeral token, so Koyeb could never pull it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # Building here with GHA layer caching is the point: Koyeb was
      # re-running `npm ci` and `next build` from a fresh archive every push.
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if superseded
        id: freshness
        run: |
          git fetch origin main --quiet
          HEAD_SHA=$(git rev-parse origin/main)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "origin/main is now $HEAD_SHA; this run ($GITHUB_SHA) is stale."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Koyeb CLI
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_CLI_VERSION: v5.10.1
        run: |
          curl -fsSL "https://github.com/koyeb/koyeb-cli/releases/download/${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION#v}_linux_amd64.tar.gz" -o /tmp/koyeb.tar.gz
          tar -xzf /tmp/koyeb.tar.gz -C /tmp koyeb
          install -m 0755 /tmp/koyeb /usr/local/bin/koyeb

      # `service update --docker`, not a raw API PATCH: a PATCH returns 2xx and
      # silently leaves the image unchanged — see docs/setup.md.
      - name: Deploy web
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          set -euo pipefail
          koyeb service update expressautomate/web \
            --docker "${IMAGE}:sha-${GITHUB_SHA}" \
            --docker-private-registry-secret "$KOYEB_REGISTRY_SECRET" \
            --token "$KOYEB_TOKEN"

      # The CLI returns before the rollout completes, so its exit code is not
      # evidence. Confirm the running image is the one this commit built.
      - name: Verify deploy landed
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          SERVICE_IDS: ${{ env.WEB_SERVICE_ID }}
        run: python3 .github/scripts/verify_koyeb.py
