name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/**'

concurrency:
  group: backend-${{ github.ref }}
  # Cancel superseded PR runs freely, but NEVER cancel a run that may be
  # deploying: workflow-level cancellation kills in-progress jobs regardless of
  # any job-level concurrency group, and the deploy job sits between
  # `alembic upgrade head` and the service rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Throwaway Postgres, never the live database — the suite creates roles
        # and toggles RLS.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expressautomate
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-not-a-real-secret
      TOKEN_ENCRYPTION_KEY: ci-not-a-real-key
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_APP_ROLE: expressautomate_app
      DATABASE_APP_PASSWORD: ci-app-password
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/expressautomate
      DATABASE_URL: postgresql://expressautomate_app:ci-app-password@localhost:5432/expressautomate

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Migrate + test
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run pytest -q

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # With run-level cancellation disabled on main, a slow older run could
      # otherwise deploy after a newer commit already shipped.
      - name: Skip if superseded
        id: freshness
        run: |
          git fetch origin main --quiet
          HEAD_SHA=$(git rev-parse origin/main)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "origin/main is now $HEAD_SHA; this run ($GITHUB_SHA) is stale."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.freshness.outputs.stale == 'false'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Migrate production
        if: steps.freshness.outputs.stale == 'false'
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      # Koyeb builds the Dockerfile from an uploaded archive. A prebuilt GHCR
      # image would be faster, but needs a PAT with write:packages —
      # .github/scripts/deploy_koyeb.py is ready for that switch. See
      # docs/setup.md.
      - name: Install Koyeb CLI
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_CLI_VERSION: v5.10.1
        run: |
          curl -fsSL "https://github.com/koyeb/koyeb-cli/releases/download/${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION#v}_linux_amd64.tar.gz" -o /tmp/koyeb.tar.gz
          tar -xzf /tmp/koyeb.tar.gz -C /tmp koyeb
          install -m 0755 /tmp/koyeb /usr/local/bin/koyeb

      - name: Deploy api + worker
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          set -euo pipefail
          koyeb deploy ./backend expressautomate/api \
            --archive-builder docker --archive-docker-dockerfile Dockerfile \
            --token "$KOYEB_TOKEN"
          koyeb deploy ./backend expressautomate/worker \
            --archive-builder docker --archive-docker-dockerfile Dockerfile \
            --archive-docker-command python \
            --archive-docker-args -u --archive-docker-args -m \
            --archive-docker-args app.workers.main \
            --token "$KOYEB_TOKEN"
