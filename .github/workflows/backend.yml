name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - '.github/scripts/**'

concurrency:
  group: backend-${{ github.ref }}
  # Cancel superseded PR runs freely, but NEVER cancel a run that may be
  # deploying: workflow-level cancellation kills in-progress jobs regardless of
  # any job-level concurrency group, and the deploy job sits between
  # `alembic upgrade head` and the service rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kianwoon/expressautomate-api
  KOYEB_REGISTRY_SECRET: ghcr-expressautomate
  API_SERVICE_ID: 4a352e28-a0dc-4ae8-bda1-9b13c0605b27
  WORKER_SERVICE_ID: e1423408-7877-43bd-ad6f-182f0e6f2ddd

jobs:
  # Tests and the image build are independent, so they run concurrently: the
  # critical path is the slower of the two, not their sum. Neither result
  # reaches Koyeb unless both pass.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Throwaway Postgres, never the live database — the suite creates roles
        # and toggles RLS.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expressautomate
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-not-a-real-secret
      TOKEN_ENCRYPTION_KEY: ci-not-a-real-key
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_APP_ROLE: expressautomate_app
      DATABASE_APP_PASSWORD: ci-app-password
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/expressautomate
      DATABASE_URL: postgresql://expressautomate_app:ci-app-password@localhost:5432/expressautomate

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Migrate + test
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Authenticate as the PAT, not GITHUB_TOKEN: a package created by
      # GITHUB_TOKEN is readable only by that ephemeral token, so Koyeb could
      # never pull it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # GHA layer caching is the point of the whole exercise — Koyeb rebuilt
      # from scratch on every deploy, this reuses unchanged layers.
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # With run-level cancellation disabled on main, a slow older run could
      # otherwise deploy after a newer commit already shipped.
      - name: Skip if superseded
        id: freshness
        run: |
          git fetch origin main --quiet
          HEAD_SHA=$(git rev-parse origin/main)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "origin/main is now $HEAD_SHA; this run ($GITHUB_SHA) is stale."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.freshness.outputs.stale == 'false'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Migrate production
        if: steps.freshness.outputs.stale == 'false'
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      # Point both services at the image built above. Koyeb pulls a finished,
      # layer-cached image instead of rebuilding from an uploaded archive. No
      # CLI download either, so nothing pipes an upstream script into a shell
      # in a step holding production credentials.
      - name: Deploy api + worker
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          KOYEB_REGISTRY_SECRET: ${{ env.KOYEB_REGISTRY_SECRET }}
          API_SERVICE_ID: ${{ env.API_SERVICE_ID }}
          WORKER_SERVICE_ID: ${{ env.WORKER_SERVICE_ID }}
        run: python3 .github/scripts/deploy_koyeb.py
