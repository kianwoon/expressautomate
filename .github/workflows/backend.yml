name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
      - '.github/scripts/**'

concurrency:
  group: cicd-${{ github.ref }}
  # Cancel superseded PR runs freely, but NEVER cancel a run that may be
  # deploying: workflow-level cancellation kills in-progress jobs regardless of
  # any job-level concurrency group, and the deploy job sits between
  # `alembic upgrade head` and the service rollout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kianwoon/expressautomate-api
  KOYEB_REGISTRY_SECRET: ghcr-expressautomate
  API_SERVICE_ID: 4a352e28-a0dc-4ae8-bda1-9b13c0605b27
  WORKER_SERVICE_ID: e1423408-7877-43bd-ad6f-182f0e6f2ddd

jobs:
  # The image depends only on backend/, frontend/ and the Dockerfile. Tagging by
  # commit SHA meant a workflow- or docs-only commit produced a *new* tag for
  # byte-identical content, so every push rebuilt and every push restarted both
  # services. Tagging by a hash of those inputs makes the build skippable: if
  # the tag already exists in the registry, there is nothing to build.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          # git object ids already hash content, so hashing the tree listing is
          # enough — no need to read the files.
          TAG=img-$(git ls-tree -r HEAD --format='%(objectname) %(path)' \
                     -- backend frontend Dockerfile | sha256sum | cut -c1-16)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          BEARER=$(printf '%s' "$GHCR_PAT" | base64 -w0)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $BEARER" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$TAG")
          if [ "$CODE" = "200" ]; then
            echo "$TAG already in the registry; skipping build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG not found (HTTP $CODE); build required"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # Tests and the image build are independent, so they run concurrently: the
  # critical path is the slower of the two, not their sum. Neither result
  # reaches Koyeb unless both pass.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Throwaway Postgres, never the live database — the suite creates roles
        # and toggles RLS.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expressautomate
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-not-a-real-secret
      TOKEN_ENCRYPTION_KEY: ci-not-a-real-key
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_APP_ROLE: expressautomate_app
      DATABASE_APP_PASSWORD: ci-app-password
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/expressautomate
      DATABASE_URL: postgresql://expressautomate_app:ci-app-password@localhost:5432/expressautomate

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Migrate + test
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run pytest -q

  build:
    needs: [plan]
    # Nothing to do when an image for this exact content is already published.
    if: needs.plan.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Authenticate as the PAT, not GITHUB_TOKEN: a package created by
      # GITHUB_TOKEN is readable only by that ephemeral token, so Koyeb could
      # never pull it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # GHA layer caching is the point of the whole exercise — Koyeb rebuilt
      # from scratch on every deploy, this reuses unchanged layers.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.plan.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.test.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    # `always()`-free: the guard above already handles build being skipped,
    # which GitHub otherwise treats as a reason to skip this job too.
    needs: [plan, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # With run-level cancellation disabled on main, a slow older run could
      # otherwise deploy after a newer commit already shipped.
      - name: Skip if superseded
        id: freshness
        run: |
          git fetch origin main --quiet
          HEAD_SHA=$(git rev-parse origin/main)
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only a NEWER commit touching the backend supersedes this deploy. A
          # bare "origin/main moved" check skipped whenever an unrelated
          # commit landed mid-build — and because the paths filter means no
          # further run is triggered, that deploy was never retried. It
          # happened: a frontend change sat undeployed until fixed by hand.
          CHANGED=$(git diff --name-only "$GITHUB_SHA" "$HEAD_SHA" -- backend/ frontend/ Dockerfile .github/workflows/backend.yml .github/scripts/)
          if [ -n "$CHANGED" ]; then
            echo "origin/main is now $HEAD_SHA and changes the backend; this run is stale."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "origin/main moved to $HEAD_SHA but the backend is unchanged; deploying."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # Both services run the SAME image, but they do different jobs:
      #   api    serves the site AND the API  -> needs frontend or backend changes
      #   worker runs background jobs only    -> needs backend changes only
      # So a frontend-only commit redeploys api and leaves the worker alone,
      # instead of restarting both for a copy tweak.
      - name: Decide what to deploy
        id: scope
        if: steps.freshness.outputs.stale == 'false'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          BEFORE="${{ github.event.before }}"
          # All-zeros on a branch's first push, and a force-push can leave it
          # unreachable — deploy everything rather than guess.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no usable diff base; deploying both services"
            echo "api=true"    >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Anything shared (Dockerfile, workflow, deploy scripts) counts as a
          # backend change: it can alter how either service is built or run.
          if echo "$CHANGED" | grep -qE '^(backend/|Dockerfile$|\.github/)'; then
            BACKEND=true
          else
            BACKEND=false
          fi
          if echo "$CHANGED" | grep -qE '^frontend/'; then
            FRONTEND=true
          else
            FRONTEND=false
          fi

          # api serves both tiers; worker only ever needs backend changes.
          if [ "$BACKEND" = true ] || [ "$FRONTEND" = true ]; then API=true; else API=false; fi

          # A service already on the target image needs nothing: restarting it
          # would drop connections to ship bytes it is already running. This is
          # what made a workflow-only commit redeploy both services.
          running() {
            curl -s -H "Authorization: Bearer $KOYEB_TOKEN" \
              "https://app.koyeb.com/v1/services/$1" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["service"]["latest_deployment_id"])' \
            | xargs -I{} curl -s -H "Authorization: Bearer $KOYEB_TOKEN" \
              "https://app.koyeb.com/v1/deployments/{}" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin)["deployment"]["definition"]; print((d.get("docker") or {}).get("image",""))'
          }
          TARGET="${IMAGE}:${TAG}"
          if [ "$API" = true ] && [ "$(running "$API_SERVICE_ID")" = "$TARGET" ]; then
            echo "api already on $TARGET"; API=false
          fi
          if [ "$BACKEND" = true ] && [ "$(running "$WORKER_SERVICE_ID")" = "$TARGET" ]; then
            echo "worker already on $TARGET"; BACKEND=false
          fi

          echo "api=$API"        >> "$GITHUB_OUTPUT"
          echo "worker=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "-> api=$API worker=$BACKEND"

      - uses: astral-sh/setup-uv@v6
        if: steps.freshness.outputs.stale == 'false' && steps.scope.outputs.worker == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Migrations are backend-only; a frontend commit must not touch the schema.
      - name: Migrate production
        if: steps.freshness.outputs.stale == 'false' && steps.scope.outputs.worker == 'true'
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      # Pinned tarball, not `curl | sh` from master: this step holds
      # KOYEB_TOKEN and DATABASE_ADMIN_URL.
      - name: Install Koyeb CLI
        if: >-
          steps.freshness.outputs.stale == 'false' &&
          (steps.scope.outputs.api == 'true' || steps.scope.outputs.worker == 'true')
        env:
          KOYEB_CLI_VERSION: v5.10.1
        run: |
          curl -fsSL "https://github.com/koyeb/koyeb-cli/releases/download/${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION#v}_linux_amd64.tar.gz" -o /tmp/koyeb.tar.gz
          tar -xzf /tmp/koyeb.tar.gz -C /tmp koyeb
          install -m 0755 /tmp/koyeb /usr/local/bin/koyeb

      # Point both services at the image built above; Koyeb pulls it instead of
      # rebuilding from an uploaded archive.
      #
      # `service update --docker` rather than a raw API PATCH: a PATCH carrying
      # the full definition returned 2xx but left the image unchanged for over
      # a minute, so the deploy silently ran the previous build. The CLI applies
      # the source change reliably. deploy_koyeb.py is kept for its payload
      # logic and tests, but is not on the deploy path.
      - name: Deploy api
        if: steps.freshness.outputs.stale == 'false' && steps.scope.outputs.api == 'true'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          koyeb service update expressautomate/api \
            --docker "${IMAGE}:${TAG}" \
            --docker-private-registry-secret "$KOYEB_REGISTRY_SECRET" \
            --token "$KOYEB_TOKEN"

      - name: Deploy worker
        if: steps.freshness.outputs.stale == 'false' && steps.scope.outputs.worker == 'true'
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          koyeb service update expressautomate/worker \
            --docker "${IMAGE}:${TAG}" \
            --docker-private-registry-secret "$KOYEB_REGISTRY_SECRET" \
            --docker-command python \
            --docker-args -u --docker-args -m --docker-args app.workers.main \
            --token "$KOYEB_TOKEN"

      # api is updated before worker, so a worker failure leaves them briefly
      # on different builds. Tolerable because migrations run first and must be
      # backward-compatible with the running image anyway; re-running the
      # workflow reconciles them.
      #
      # The CLI returns before the rollout finishes, so confirm the image
      # actually landed AND became healthy rather than trusting the exit code.
      # Verify only what this run actually deployed. Checking a service that
      # was deliberately left alone would fail on its older (correct) image.
      - name: Verify deploy landed
        if: >-
          steps.freshness.outputs.stale == 'false' &&
          (steps.scope.outputs.api == 'true' || steps.scope.outputs.worker == 'true')
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          IMAGE_TAG: ${{ needs.plan.outputs.tag }}
          SERVICE_IDS: >-
            ${{ steps.scope.outputs.api == 'true' && env.API_SERVICE_ID || '' }}${{
            steps.scope.outputs.api == 'true' && steps.scope.outputs.worker == 'true' && ',' || ''
            }}${{ steps.scope.outputs.worker == 'true' && env.WORKER_SERVICE_ID || '' }}
          # Both carry DATABASE_URL and friends; a definition that lost them
          # would boot and fail at the first query.
          MIN_ENV_VARS: 5
        run: python3 .github/scripts/verify_koyeb.py
