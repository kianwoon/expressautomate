name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kianwoon/expressautomate-api
  # Koyeb registry secret holding the GHCR pull credentials.
  KOYEB_REGISTRY_SECRET: ghcr-expressautomate
  API_SERVICE_ID: 4a352e28-a0dc-4ae8-bda1-9b13c0605b27
  WORKER_SERVICE_ID: e1423408-7877-43bd-ad6f-182f0e6f2ddd

jobs:
  # Tests and the image build are independent — running them in parallel keeps
  # the critical path at whichever is slower, not their sum. Nothing is
  # promoted to Koyeb unless both succeed.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Throwaway Postgres, never the live database — the suite creates roles
        # and toggles RLS.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expressautomate
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-not-a-real-secret
      TOKEN_ENCRYPTION_KEY: ci-not-a-real-key
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_APP_ROLE: expressautomate_app
      DATABASE_APP_PASSWORD: ci-app-password
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/expressautomate
      DATABASE_URL: postgresql://expressautomate_app:ci-app-password@localhost:5432/expressautomate

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Migrate + test
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run pytest -q

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Migrate production
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      # Point the services at the freshly pushed image. Koyeb pulls a prebuilt
      # layer-cached image instead of rebuilding from an uploaded archive,
      # which is where the previous pipeline lost most of its time. No CLI
      # download, and no piping an upstream install script into a shell in a
      # step that holds production credentials.
      # Koyeb builds the Dockerfile from an uploaded archive. Pushing a
      # prebuilt image to GHCR would be faster (Actions caches layers; Koyeb
      # does not), but the available PAT is fine-grained and scoped to another
      # package, so it can neither create nor read `expressautomate-api`.
      # deploy_koyeb.py is ready for the switch the moment a PAT with
      # write:packages exists — see docs/setup.md.
      - name: Install Koyeb CLI
        env:
          KOYEB_CLI_VERSION: v5.10.1
        run: |
          curl -fsSL "https://github.com/koyeb/koyeb-cli/releases/download/${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION#v}_linux_amd64.tar.gz" -o /tmp/koyeb.tar.gz
          tar -xzf /tmp/koyeb.tar.gz -C /tmp koyeb
          install -m 0755 /tmp/koyeb /usr/local/bin/koyeb

      - name: Deploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          set -euo pipefail
          koyeb deploy ./backend expressautomate/api \
            --archive-builder docker --archive-docker-dockerfile Dockerfile \
            --token "$KOYEB_TOKEN"
          koyeb deploy ./backend expressautomate/worker \
            --archive-builder docker --archive-docker-dockerfile Dockerfile \
            --archive-docker-command python \
            --archive-docker-args -u --archive-docker-args -m \
            --archive-docker-args app.workers.main \
            --token "$KOYEB_TOKEN"
