name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push to main supersedes an in-flight deploy; never race two.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Tests run against a throwaway Postgres, never the live database —
        # they create roles and toggle RLS, which must not touch production.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expressautomate
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-not-a-real-secret
      TOKEN_ENCRYPTION_KEY: ci-not-a-real-key
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_APP_ROLE: expressautomate_app
      DATABASE_APP_PASSWORD: ci-app-password
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/expressautomate
      DATABASE_URL: postgresql://expressautomate_app:ci-app-password@localhost:5432/expressautomate

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Tests
        working-directory: backend
        run: uv run pytest -q

  deploy:
    # Only main deploys, and only behind green tests.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pinned to a tag, not master. These steps hold DATABASE_ADMIN_URL and
      # KOYEB_TOKEN, so piping an unpinned upstream script into a shell would
      # let any change to that script run with production credentials.
      - name: Install Koyeb CLI
        env:
          KOYEB_CLI_VERSION: v5.10.1
        run: |
          curl -fsSL "https://github.com/koyeb/koyeb-cli/releases/download/${KOYEB_CLI_VERSION}/koyeb-cli_${KOYEB_CLI_VERSION#v}_linux_amd64.tar.gz" \
            -o /tmp/koyeb.tar.gz
          tar -xzf /tmp/koyeb.tar.gz -C /tmp koyeb
          install -m 0755 /tmp/koyeb /usr/local/bin/koyeb
          koyeb version

      - name: Migrate the production database
        # Runs before the new image serves traffic. Migrations must be
        # backward-compatible with the image still running.
        working-directory: backend
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          uv sync --frozen
          uv run alembic upgrade head

      # Koyeb builds from an uploaded archive rather than a registry: the
      # image lives in a private GHCR package that only the Actions-scoped
      # GITHUB_TOKEN can read, which Koyeb cannot reuse. Archive deploy keeps
      # one credential (KOYEB_TOKEN) in play instead of minting a second PAT.
      - name: Deploy API
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb deploy ./backend expressautomate/api \
            --archive-builder docker \
            --archive-docker-dockerfile Dockerfile \
            --token "$KOYEB_TOKEN"

      - name: Deploy worker
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb deploy ./backend expressautomate/worker \
            --archive-builder docker \
            --archive-docker-dockerfile Dockerfile \
            --archive-docker-command python \
            --archive-docker-args -u \
            --archive-docker-args -m \
            --archive-docker-args app.workers.main \
            --token "$KOYEB_TOKEN"
