[project]
name = "expressautomate-backend"
version = "0.1.0"
description = "expressautomate.app — AI recruitment intelligence & operations platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "cryptography>=44.0",
    "python-multipart>=0.0.18",
    "structlog>=24.4",
    "msal>=1.31",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; reformatting them only creates diff noise.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine in app.db.session is module-level, so its pooled asyncpg
# connections bind to whichever loop first opened them. A per-test loop would
# leave them stranded ("Event loop is closed") — every test shares one loop.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
